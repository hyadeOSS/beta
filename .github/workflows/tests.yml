# Runs the kernel tests (test/*.test.js) on every pull request and push to main, on Linux,
# Windows and macOS: hyadeOS has to behave the same on all three.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install kernel dependencies
        run: npm ci --omit=dev
      - name: Run tests
        run: npm test
